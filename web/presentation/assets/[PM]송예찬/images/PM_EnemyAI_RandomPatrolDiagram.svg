<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070914"/>
      <stop offset="0.55" stop-color="#0a1221"/>
      <stop offset="1" stop-color="#071824"/>
    </linearGradient>
    <radialGradient id="zone" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#25c9dc" stop-opacity=".13"/>
      <stop offset=".72" stop-color="#25c9dc" stop-opacity=".055"/>
      <stop offset="1" stop-color="#25c9dc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="routeA" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#78f1ff"/><stop offset="1" stop-color="#25c9dc"/>
    </linearGradient>
    <linearGradient id="routeB" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#b693ff"/><stop offset="1" stop-color="#7f5bff"/>
    </linearGradient>
    <filter id="glowCyan" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowViolet" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse">
      <path d="M54 0H0V54" fill="none" stroke="#45d7e8" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <marker id="arrowCyan" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#78f1ff"/>
    </marker>
    <marker id="arrowViolet" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#a58bff"/>
    </marker>
  </defs>

  <rect width="1600" height="900" rx="34" fill="url(#bg)"/>
  <rect x="26" y="26" width="1548" height="848" rx="28" fill="none" stroke="#53dae9" stroke-opacity=".19"/>
  <path d="M68 690L305 240L548 690L795 245L1030 690L1275 250L1510 690Z" fill="url(#grid)" opacity=".6"/>
  <rect x="70" y="195" width="1460" height="540" rx="28" fill="url(#grid)" opacity=".52"/>

  <text x="78" y="88" fill="#78f1ff" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" font-weight="800" letter-spacing="4">CONTROLLED RANDOM PATROL</text>
  <text x="78" y="142" fill="#f4f6ff" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="42" font-weight="800">패트롤 루트 안에서 매번 달라지는 순찰 궤적</text>
  <text x="1522" y="94" text-anchor="end" fill="#8f9bb6" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="17">루트는 통제하고 · 목적지는 무작위화한다</text>

  <!-- logical route -->
  <path d="M285 492 C410 450 505 438 625 420 S855 458 970 492 S1190 455 1315 420"
        fill="none" stroke="#d9f9ff" stroke-opacity=".32" stroke-width="5" stroke-dasharray="14 13"/>
  <text x="800" y="386" text-anchor="middle" fill="#c7d1e3" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="17">패트롤 포인트의 논리적 연결</text>

  <!-- patrol zones -->
  <g font-family="Noto Sans KR, Malgun Gothic, sans-serif">
    <g>
      <circle cx="285" cy="492" r="165" fill="url(#zone)" stroke="#25c9dc" stroke-opacity=".5" stroke-width="2" stroke-dasharray="8 9"/>
      <circle cx="285" cy="492" r="18" fill="#071824" stroke="#78f1ff" stroke-width="4" filter="url(#glowCyan)"/>
      <text x="285" y="277" text-anchor="middle" fill="#78f1ff" font-size="18" font-weight="800">POINT 01</text>
      <text x="285" y="304" text-anchor="middle" fill="#8f9bb6" font-size="15">랜덤 목적지 후보 반경</text>
    </g>
    <g>
      <circle cx="625" cy="420" r="165" fill="url(#zone)" stroke="#25c9dc" stroke-opacity=".5" stroke-width="2" stroke-dasharray="8 9"/>
      <circle cx="625" cy="420" r="18" fill="#071824" stroke="#78f1ff" stroke-width="4" filter="url(#glowCyan)"/>
      <text x="625" y="205" text-anchor="middle" fill="#78f1ff" font-size="18" font-weight="800">POINT 02</text>
      <text x="625" y="232" text-anchor="middle" fill="#8f9bb6" font-size="15">반경 안에서 여러 번 배회</text>
    </g>
    <g>
      <circle cx="970" cy="492" r="165" fill="url(#zone)" stroke="#25c9dc" stroke-opacity=".5" stroke-width="2" stroke-dasharray="8 9"/>
      <circle cx="970" cy="492" r="18" fill="#071824" stroke="#78f1ff" stroke-width="4" filter="url(#glowCyan)"/>
      <text x="970" y="277" text-anchor="middle" fill="#78f1ff" font-size="18" font-weight="800">POINT 03</text>
      <text x="970" y="304" text-anchor="middle" fill="#8f9bb6" font-size="15">이동 불가 후보는 제외</text>
    </g>
    <g>
      <circle cx="1315" cy="420" r="165" fill="url(#zone)" stroke="#25c9dc" stroke-opacity=".5" stroke-width="2" stroke-dasharray="8 9"/>
      <circle cx="1315" cy="420" r="18" fill="#071824" stroke="#78f1ff" stroke-width="4" filter="url(#glowCyan)"/>
      <text x="1315" y="205" text-anchor="middle" fill="#78f1ff" font-size="18" font-weight="800">POINT 04</text>
      <text x="1315" y="232" text-anchor="middle" fill="#8f9bb6" font-size="15">가까운 다음 포인트 선택</text>
    </g>
  </g>

  <!-- candidate dots -->
  <g fill="#78f1ff" opacity=".48">
    <circle cx="210" cy="430" r="5"/><circle cx="350" cy="555" r="5"/><circle cx="370" cy="440" r="5"/>
    <circle cx="548" cy="350" r="5"/><circle cx="690" cy="485" r="5"/><circle cx="710" cy="365" r="5"/>
    <circle cx="890" cy="430" r="5"/><circle cx="1040" cy="570" r="5"/><circle cx="1082" cy="445" r="5"/>
    <circle cx="1235" cy="342" r="5"/><circle cx="1385" cy="500" r="5"/><circle cx="1430" cy="380" r="5"/>
  </g>

  <!-- selected random destinations -->
  <g fill="#071824" stroke="#f1fbff" stroke-width="3">
    <path d="M210 418l12 12-12 12-12-12z"/><path d="M350 543l12 12-12 12-12-12z"/>
    <path d="M548 338l12 12-12 12-12-12z"/><path d="M690 473l12 12-12 12-12-12z"/>
    <path d="M890 418l12 12-12 12-12-12z"/><path d="M1040 558l12 12-12 12-12-12z"/>
    <path d="M1235 330l12 12-12 12-12-12z"/><path d="M1385 488l12 12-12 12-12-12z"/>
  </g>

  <!-- obstacle / rejected sample -->
  <path d="M1018 425h82v78h-82z" fill="#111827" stroke="#6c7894" stroke-width="2"/>
  <path d="M1028 435l62 58M1090 435l-62 58" stroke="#ff647c" stroke-width="5"/>
  <text x="1058" y="522" text-anchor="middle" fill="#ff8295" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="14" font-weight="700">경로 불완전 · 제외</text>

  <!-- two actual routes -->
  <path d="M210 430 C248 405 310 420 350 555 C405 585 485 375 548 350 C610 320 640 445 690 485 C742 520 818 470 890 430 C930 408 996 515 1040 570 C1095 610 1170 405 1235 342 C1298 286 1352 410 1385 500"
        fill="none" stroke="url(#routeA)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowCyan)" filter="url(#glowCyan)"/>
  <path d="M350 555 C305 515 248 470 210 430 C252 370 330 420 370 440 C430 468 505 395 548 350 C595 300 655 430 690 485 C745 548 835 530 890 430 C925 362 1006 478 1040 570 C1090 625 1188 405 1235 342 C1285 280 1360 400 1385 500"
        fill="none" stroke="url(#routeB)" stroke-width="4" stroke-opacity=".9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowViolet)" filter="url(#glowViolet)"/>

  <!-- route labels -->
  <g font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="16" font-weight="800">
    <rect x="94" y="650" width="210" height="42" rx="21" fill="#071824" stroke="#78f1ff" stroke-opacity=".7"/>
    <path d="M116 671h38" stroke="#78f1ff" stroke-width="6" stroke-linecap="round"/>
    <text x="170" y="677" fill="#dffcff">실제 순찰 궤적 A</text>
    <rect x="320" y="650" width="210" height="42" rx="21" fill="#071824" stroke="#a58bff" stroke-opacity=".7"/>
    <path d="M342 671h38" stroke="#a58bff" stroke-width="5" stroke-linecap="round"/>
    <text x="396" y="677" fill="#eee8ff">실제 순찰 궤적 B</text>
  </g>

  <!-- bottom logic -->
  <g font-family="Noto Sans KR, Malgun Gothic, sans-serif">
    <rect x="75" y="756" width="1450" height="92" rx="20" fill="#0c1325" stroke="#4ad8e8" stroke-opacity=".18"/>
    <g transform="translate(104 778)">
      <circle cx="20" cy="22" r="20" fill="#25c9dc" fill-opacity=".14"/><text x="20" y="29" text-anchor="middle" fill="#78f1ff" font-size="18" font-weight="900">1</text>
      <text x="55" y="16" fill="#f4f6ff" font-size="18" font-weight="800">반경 안 랜덤 후보</text>
      <text x="55" y="43" fill="#8f9bb6" font-size="15">Random.insideUnitCircle</text>
    </g>
    <path d="M500 800h55" stroke="#3d4b67" stroke-width="2" marker-end="url(#arrowCyan)"/>
    <g transform="translate(590 778)">
      <circle cx="20" cy="22" r="20" fill="#25c9dc" fill-opacity=".14"/><text x="20" y="29" text-anchor="middle" fill="#78f1ff" font-size="18" font-weight="900">2</text>
      <text x="55" y="16" fill="#f4f6ff" font-size="18" font-weight="800">NavMesh 도달 가능 검증</text>
      <text x="55" y="43" fill="#8f9bb6" font-size="15">SamplePosition + PathComplete</text>
    </g>
    <path d="M1040 800h55" stroke="#3d4b67" stroke-width="2" marker-end="url(#arrowCyan)"/>
    <g transform="translate(1130 778)">
      <circle cx="20" cy="22" r="20" fill="#25c9dc" fill-opacity=".14"/><text x="20" y="29" text-anchor="middle" fill="#78f1ff" font-size="18" font-weight="900">3</text>
      <text x="55" y="16" fill="#f4f6ff" font-size="18" font-weight="800">루트 범위 안에서 이동</text>
      <text x="55" y="43" fill="#8f9bb6" font-size="15">가까운 다음 포인트 무작위 선택</text>
    </g>
  </g>
</svg>