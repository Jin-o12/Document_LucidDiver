<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>송예찬 — 역할과 전체 기여</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #03050c;
      --panel: rgba(10, 15, 31, 0.94);
      --panel-2: #0d1428;
      --text: #f5f7ff;
      --muted: #aab4ca;
      --cyan: #6ce7f2;
      --violet: #ad77ff;
      --gold: #f0bb73;
      --line: rgba(122, 226, 239, 0.24);
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Pretendard, "Noto Sans KR", "Malgun Gothic", sans-serif;
    }

    button, a { font: inherit; }
    button { color: inherit; }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 16% 18%, rgba(94, 60, 173, 0.18), transparent 31%),
        radial-gradient(circle at 82% 72%, rgba(27, 147, 168, 0.14), transparent 32%),
        linear-gradient(rgba(106, 231, 242, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(106, 231, 242, 0.025) 1px, transparent 1px);
      background-size: auto, auto, 48px 48px, 48px 48px;
    }

    .page {
      position: relative;
      min-height: 100%;
      padding: clamp(28px, 4.6vh, 58px) clamp(28px, 6vw, 112px) 32px;
      isolation: isolate;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--cyan);
      font-size: clamp(0.65rem, 0.8vw, 0.82rem);
      font-weight: 800;
      letter-spacing: 0.23em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 1100px;
      margin: 0;
      font-size: clamp(2.05rem, 4.2vw, 4.7rem);
      line-height: 1.06;
      letter-spacing: -0.045em;
    }

    .lead {
      max-width: 840px;
      margin: 15px 0 0;
      color: #c2cada;
      font-size: clamp(0.88rem, 1.15vw, 1.08rem);
      line-height: 1.68;
    }

    .role-board {
      position: relative;
      width: min(1360px, 100%);
      height: min(58vh, 570px);
      min-height: 390px;
      margin: clamp(22px, 4vh, 44px) auto 0;
    }

    .role-board::before {
      content: "";
      position: absolute;
      left: 8%;
      right: 8%;
      top: 50%;
      height: 1px;
      transform: rotate(14deg);
      transform-origin: center;
      background: linear-gradient(90deg, transparent, rgba(108, 231, 242, 0.38), rgba(173, 119, 255, 0.32), transparent);
      box-shadow: 0 0 18px rgba(108, 231, 242, 0.18);
    }

    .role-card {
      --accent: var(--cyan);
      position: absolute;
      width: min(37vw, 470px);
      min-width: 320px;
      height: clamp(180px, 23vh, 236px);
      padding: clamp(22px, 2.2vw, 34px);
      overflow: hidden;
      text-align: left;
      border: 1px solid color-mix(in srgb, var(--accent) 36%, transparent);
      border-radius: 22px;
      background:
        linear-gradient(135deg, color-mix(in srgb, var(--accent) 10%, transparent), transparent 48%),
        rgba(8, 13, 28, 0.9);
      box-shadow: 0 22px 50px rgba(0, 0, 0, 0.4), inset 0 1px rgba(255,255,255,0.035);
      cursor: pointer;
      transition: transform 220ms ease, border-color 220ms ease, box-shadow 220ms ease, filter 220ms ease;
    }

    .role-card::after {
      content: "";
      position: absolute;
      inset: auto -25% -55% 35%;
      height: 170px;
      border-radius: 50%;
      background: var(--accent);
      filter: blur(75px);
      opacity: 0.13;
      pointer-events: none;
    }

    .role-card:hover,
    .role-card:focus-visible {
      transform: translateY(-8px) scale(1.025);
      border-color: color-mix(in srgb, var(--accent) 78%, transparent);
      box-shadow: 0 28px 64px rgba(0,0,0,0.5), 0 0 35px color-mix(in srgb, var(--accent) 23%, transparent);
      outline: none;
      filter: brightness(1.08);
    }

    .role-card.pm { --accent: var(--cyan); left: 1%; top: 0; }
    .role-card.planning { --accent: var(--violet); left: 31.5%; top: 30%; }
    .role-card.development { --accent: var(--gold); right: 1%; bottom: 0; }

    .card-index {
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 0.18em;
    }

    .role-card h2 {
      margin: 12px 0 10px;
      font-size: clamp(1.35rem, 2.1vw, 2.05rem);
      letter-spacing: -0.035em;
    }

    .role-card p {
      max-width: 390px;
      margin: 0;
      color: #b6bfd2;
      font-size: clamp(0.78rem, 0.92vw, 0.93rem);
      line-height: 1.58;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 16px;
    }

    .chip {
      padding: 6px 10px;
      border: 1px solid color-mix(in srgb, var(--accent) 28%, transparent);
      border-radius: 999px;
      background: rgba(255,255,255,0.028);
      color: #dce2ef;
      font-size: clamp(0.64rem, 0.72vw, 0.74rem);
      white-space: nowrap;
    }

    .open-label {
      position: absolute;
      right: 24px;
      bottom: 20px;
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 800;
      opacity: 0;
      transform: translateX(-8px);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .role-card:hover .open-label,
    .role-card:focus-visible .open-label { opacity: 1; transform: translateX(0); }

    .page-foot {
      position: fixed;
      left: clamp(28px, 6vw, 112px);
      right: clamp(28px, 6vw, 112px);
      bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #7e8aa5;
      font-size: 0.72rem;
      pointer-events: none;
    }

    .page-count { color: var(--cyan); font-weight: 800; letter-spacing: 0.15em; }

    .modal-layer {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      padding: clamp(12px, 2.5vw, 38px);
      background: rgba(0, 2, 9, 0.78);
      backdrop-filter: blur(10px) saturate(0.72);
      opacity: 0;
      pointer-events: none;
      transition: opacity 190ms ease;
    }

    .modal-layer.open { opacity: 1; pointer-events: auto; }

    .detail {
      --accent: var(--cyan);
      position: relative;
      width: min(1180px, 96vw);
      height: min(820px, 92vh);
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--accent) 38%, transparent);
      border-radius: 24px;
      background: rgba(7, 11, 24, 0.985);
      box-shadow: 0 40px 110px rgba(0,0,0,0.72), 0 0 55px color-mix(in srgb, var(--accent) 13%, transparent);
      transform: translateY(24px) scale(0.965);
      transition: transform 220ms cubic-bezier(.2,.75,.2,1);
    }

    .modal-layer.open .detail { transform: translateY(0) scale(1); }
    .detail[data-kind="planning"] { --accent: var(--violet); }
    .detail[data-kind="development"] { --accent: var(--gold); }

    .detail-head {
      position: absolute;
      inset: 0 0 auto;
      z-index: 3;
      min-height: 116px;
      padding: 23px 82px 20px 34px;
      border-bottom: 1px solid color-mix(in srgb, var(--accent) 24%, transparent);
      background: rgba(8, 13, 28, 0.96);
      backdrop-filter: blur(12px);
    }

    .detail-kicker {
      margin: 0 0 6px;
      color: var(--accent);
      font-size: 0.7rem;
      font-weight: 900;
      letter-spacing: 0.16em;
    }

    .detail-title {
      margin: 0;
      font-size: clamp(1.65rem, 2.7vw, 2.65rem);
      letter-spacing: -0.04em;
    }

    .close {
      position: absolute;
      top: 26px;
      right: 27px;
      z-index: 5;
      width: 46px;
      height: 46px;
      padding: 0;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 50%;
      background: rgba(255,255,255,0.035);
      color: #f5f7ff;
      font-size: 1.35rem;
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    .close:hover, .close:focus-visible {
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 13%, transparent);
      transform: rotate(5deg) scale(1.06);
      outline: none;
    }

    .detail-scroll {
      height: 100%;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 145px clamp(24px, 4vw, 58px) 40px;
      scrollbar-color: color-mix(in srgb, var(--accent) 58%, transparent) rgba(255,255,255,0.04);
      scrollbar-width: thin;
    }

    .detail-intro {
      max-width: 880px;
      margin: 0 0 28px;
      color: #c3cbdb;
      font-size: clamp(0.9rem, 1.1vw, 1.04rem);
      line-height: 1.75;
    }

    .section-label {
      margin: 30px 0 14px;
      color: var(--accent);
      font-size: 0.76rem;
      font-weight: 900;
      letter-spacing: 0.14em;
    }

    .work-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 13px;
    }

    .work-item {
      padding: 19px 20px;
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 15px;
      background: rgba(255,255,255,0.027);
    }

    .work-item h3 {
      margin: 0 0 8px;
      color: #f4f6ff;
      font-size: 1rem;
    }

    .work-item p {
      margin: 0;
      color: #aeb8cd;
      font-size: 0.84rem;
      line-height: 1.65;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      margin-bottom: 10px;
      padding: 5px 9px;
      border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
      border-radius: 999px;
      color: var(--accent);
      font-size: 0.65rem;
      font-weight: 850;
      letter-spacing: 0.05em;
    }

    .notice {
      margin-top: 17px;
      padding: 16px 18px;
      border-left: 3px solid var(--accent);
      border-radius: 0 12px 12px 0;
      background: color-mix(in srgb, var(--accent) 7%, transparent);
      color: #c5cede;
      font-size: 0.82rem;
      line-height: 1.65;
    }

    .evidence-hero { margin: 0 0 16px; }
    .evidence-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-bottom: 28px; }
    .evidence-link { display: block; position: relative; overflow: hidden; border: 1px solid color-mix(in srgb, var(--accent) 28%, transparent); border-radius: 16px; background: #050711; color: #e7edf7; text-decoration: none; }
    .evidence-link img { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: contain; transition: transform 220ms ease, filter 220ms ease; }
    .evidence-link:hover img, .evidence-link:focus-visible img { transform: scale(1.015); filter: brightness(1.08); }
    .evidence-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .evidence-caption { display: flex; justify-content: space-between; gap: 12px; padding: 12px 15px; border-top: 1px solid rgba(255,255,255,0.08); background: rgba(8,13,28,0.94); font-size: 0.76rem; font-weight: 750; }
    .evidence-caption span:last-child { color: var(--accent); white-space: nowrap; }
    .image-viewer {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: clamp(14px, 3vw, 42px);
      background: rgba(0, 2, 9, 0.94);
      backdrop-filter: blur(14px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
    }

    .image-viewer.open { opacity: 1; pointer-events: auto; }

    .image-viewer-frame {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: min(1600px, 96vw);
      height: min(900px, 92vh);
      overflow: hidden;
      border: 1px solid rgba(86, 231, 255, 0.38);
      border-radius: 20px;
      background: #050711;
      box-shadow: 0 36px 100px rgba(0,0,0,0.78), 0 0 45px rgba(86,231,255,0.1);
      transform: scale(0.96);
      transition: transform 200ms cubic-bezier(.2,.75,.2,1);
    }

    .image-viewer.open .image-viewer-frame { transform: scale(1); }

    .image-viewer-image {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    .image-viewer-close {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 2;
      width: 46px;
      height: 46px;
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 50%;
      background: rgba(5,7,17,0.82);
      color: #fff;
      font-size: 1.35rem;
      cursor: pointer;
    }

    .image-viewer-close:hover, .image-viewer-close:focus-visible {
      border-color: var(--cyan);
      color: var(--cyan);
      outline: none;
      transform: scale(1.06);
    }
    .detail-guide { display:flex; flex-wrap:wrap; gap:8px; margin:-8px 0 24px; }
    .guide-chip { padding:7px 11px; border:1px solid rgba(255,255,255,.1); border-radius:999px; background:rgba(255,255,255,.03); color:#aeb8cd; font-size:.7rem; font-weight:800; }
    .guide-chip.direct { border-color:color-mix(in srgb,var(--accent) 44%,transparent); color:var(--accent); }
    .guide-chip.draft { border-color:rgba(170,118,255,.35); color:#c9a6ff; }
    .guide-chip.followup { border-color:rgba(255,190,102,.35); color:#ffd08f; }
    .case-stack { display:grid; gap:13px; }
    .case-study { overflow:hidden; border:1px solid rgba(255,255,255,.1); border-radius:17px; background:rgba(255,255,255,.025); }
    .case-study[open] { border-color:color-mix(in srgb,var(--accent) 34%,transparent); background:color-mix(in srgb,var(--accent) 4%,rgba(8,13,28,.98)); }
    .case-summary { position:relative; display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:14px; min-height:78px; padding:15px 52px 15px 18px; cursor:pointer; list-style:none; }
    .case-summary::-webkit-details-marker { display:none; }
    .case-summary::after { content:'+'; position:absolute; right:20px; color:var(--accent); font-size:1.35rem; transition:transform 160ms ease; }
    .case-study[open] .case-summary::after { transform:rotate(45deg); }
    .case-summary:hover { background:color-mix(in srgb,var(--accent) 6%,transparent); }
    .case-summary:focus-visible { outline:2px solid var(--accent); outline-offset:-3px; }
    .case-index { display:grid; place-items:center; width:42px; height:42px; border:1px solid color-mix(in srgb,var(--accent) 40%,transparent); border-radius:12px; color:var(--accent); font-size:.7rem; font-weight:900; }
    .case-title strong { display:block; margin-bottom:5px; color:#f3f6ff; font-size:1rem; }
    .case-title span { display:block; color:#9eabc1; font-size:.76rem; line-height:1.45; }
    .scope-tag { padding:5px 9px; border:1px solid color-mix(in srgb,var(--accent) 34%,transparent); border-radius:999px; color:var(--accent); font-size:.62rem; font-weight:900; white-space:nowrap; }
    .scope-tag.draft { border-color:rgba(170,118,255,.35); color:#c9a6ff; }
    .scope-tag.followup { border-color:rgba(255,190,102,.35); color:#ffd08f; }

    .case-body { padding:4px 20px 22px; border-top:1px solid rgba(255,255,255,.07); }
    .case-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin-top:16px; }
    .case-panel { padding:16px 17px; border:1px solid rgba(255,255,255,.08); border-radius:13px; background:rgba(3,6,16,.52); }
    .case-panel.wide { grid-column:1/-1; }
    .case-panel h4 { margin:0 0 8px; color:var(--accent); font-size:.7rem; letter-spacing:.1em; }
    .case-panel p { margin:0; color:#bec7d8; font-size:.81rem; line-height:1.68; }
    .case-panel ul { margin:0; padding-left:18px; color:#bec7d8; font-size:.79rem; line-height:1.75; }
    .flow-line { display:flex; flex-wrap:wrap; align-items:center; gap:7px; margin-top:12px; }
    .flow-line span { padding:7px 10px; border-radius:9px; background:rgba(255,255,255,.05); color:#dce3ef; font-size:.72rem; font-weight:750; }
    .flow-line i { color:var(--accent); font-style:normal; }
    .quote-proof { margin:13px 0 0; padding:14px 16px; border-left:3px solid var(--accent); border-radius:0 11px 11px 0; background:color-mix(in srgb,var(--accent) 7%,transparent); color:#e3e7f1; font-size:.85rem; line-height:1.65; }
    .code-shot { grid-column:1/-1; overflow:hidden; border:1px solid rgba(86,231,255,.19); border-radius:14px; background:#050813; box-shadow:inset 0 1px rgba(255,255,255,.03); }
    .code-head { display:flex; justify-content:space-between; gap:12px; padding:10px 13px; border-bottom:1px solid rgba(255,255,255,.08); background:rgba(12,18,36,.96); color:#8fa0bc; font-family:Consolas,'Courier New',monospace; font-size:.68rem; }
    .code-head span:last-child { color:var(--accent); white-space:nowrap; }
    .code-shot pre { margin:0; padding:15px 17px 18px; overflow-x:auto; color:#d8e5f4; font:.74rem/1.65 Consolas,'Courier New',monospace; tab-size:4; }
    .code-shot .kw { color:#c695ff; }
    .code-shot .fn { color:#5de7ff; }
    .code-shot .str { color:#ffd08f; }
    .code-shot .cm { color:#6f809b; }
    .commit-strip { display:flex; flex-wrap:wrap; gap:7px; margin-top:14px; }
    .commit-strip span { padding:5px 8px; border-radius:8px; background:rgba(255,255,255,.045); color:#8fa0bc; font:.65rem Consolas,monospace; }
    .work-ledger { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin-top:14px; }
    .ledger-item { padding:14px; border:1px solid rgba(255,255,255,.08); border-radius:12px; background:rgba(255,255,255,.025); }
    .ledger-item strong { display:block; margin-bottom:6px; color:#eef2fa; font-size:.8rem; }
    .ledger-item span { color:#98a6bc; font-size:.72rem; line-height:1.55; }
    @media (max-width:760px) { .case-summary{grid-template-columns:auto minmax(0,1fr)} .scope-tag{grid-column:2;justify-self:start} .case-grid,.work-ledger{grid-template-columns:1fr} .case-panel.wide,.code-shot{grid-column:auto} }

    .doc-showcase { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin-top:16px; }
    .doc-page { overflow:hidden; border:1px solid rgba(255,255,255,.11); border-radius:14px; background:linear-gradient(160deg,rgba(15,20,39,.98),rgba(6,9,20,.98)); box-shadow:0 12px 32px rgba(0,0,0,.24); }
    .doc-page.featured { grid-column:1/-1; border-color:color-mix(in srgb,var(--accent) 34%,transparent); }
    .doc-head { display:flex; justify-content:space-between; gap:12px; padding:13px 15px; border-bottom:1px solid rgba(255,255,255,.08); background:rgba(255,255,255,.025); }
    .doc-head strong { color:#eef3fb; font-size:.8rem; line-height:1.45; }
    .doc-version { color:var(--accent); font:700 .63rem Consolas,monospace; white-space:nowrap; }
    .doc-content { padding:15px; }
    .doc-meta { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:11px; }
    .doc-meta span { padding:4px 7px; border-radius:7px; background:rgba(255,255,255,.05); color:#98a8bf; font-size:.62rem; }
    .doc-meta .applied { color:#77efff; border:1px solid rgba(86,231,255,.25); }
    .doc-meta .draft { color:#c9a6ff; border:1px solid rgba(170,118,255,.25); }
    .doc-content h5 { margin:0 0 7px; color:var(--accent); font-size:.68rem; letter-spacing:.08em; }
    .doc-content p { margin:0; color:#bec8da; font-size:.76rem; line-height:1.65; }

    .doc-excerpt { margin:12px 0 0; padding:12px 13px; border-left:2px solid var(--accent); background:color-mix(in srgb,var(--accent) 6%,transparent); color:#e2e7f2; font-size:.78rem; line-height:1.62; }
    .doc-path { display:block; margin-top:12px; color:#697a96; font:600 .6rem/1.5 Consolas,monospace; word-break:break-all; }
    .doc-table { width:100%; margin-top:12px; border-collapse:collapse; font-size:.69rem; }
    .doc-table th,.doc-table td { padding:8px 9px; border:1px solid rgba(255,255,255,.07); text-align:left; vertical-align:top; }
    .doc-table th { color:var(--accent); background:rgba(255,255,255,.03); }
    .doc-table td { color:#b8c3d6; }
    .character-pitches { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin-top:12px; }
    .character-pitch { padding:11px; border:1px solid rgba(255,255,255,.08); border-radius:10px; background:rgba(255,255,255,.025); }
    .character-pitch strong { display:block; margin-bottom:4px; color:#edf2fb; font-size:.73rem; }
    .character-pitch span { color:#96a5bb; font-size:.65rem; line-height:1.5; }
    @media(max-width:760px){.doc-showcase,.character-pitches{grid-template-columns:1fr}.doc-page.featured{grid-column:auto}}

    .impact {
      margin-top: 26px;
      padding: 23px 24px;
      border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
      border-radius: 17px;
      background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 9%, transparent), transparent 65%);
    }

    .impact strong { display: block; margin-bottom: 8px; color: var(--accent); font-size: 0.75rem; letter-spacing: 0.12em; }
    .impact p { margin: 0; color: #e0e5f0; line-height: 1.7; }

    .detail-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;

  <script>
    (() => {
      const layer = document.getElementById('modal-layer');
      const detail = document.getElementById('detail');
      const scroll = document.getElementById('detail-scroll');
      const title = document.getElementById('detail-title');
      const kicker = document.getElementById('detail-kicker');
      const closeButton = document.getElementById('close');
      const imageViewer = document.getElementById('image-viewer');
      const imageViewerImage = document.getElementById('image-viewer-image');
      const imageViewerClose = document.getElementById('image-viewer-close');
      const order = ['pm', 'planning', 'development'];
      const labels = {
        pm: ['01 · PROJECT MANAGEMENT', 'PM 업무'],
        planning: ['02 · PLANNING', '기획 업무'],
        development: ['03 · DEVELOPMENT', '개발 업무']
      };
      let activeRole = null;
      let returnFocus = null;
      let imageReturnFocus = null;

      function openImageViewer(link) {
        const preview = link.querySelector('img');
        imageReturnFocus = link;
        imageViewerImage.src = link.href;
        imageViewerImage.alt = preview ? preview.alt : '확대 이미지';
        imageViewer.classList.add('open');
        imageViewer.setAttribute('aria-hidden', 'false');
        imageViewerClose.focus();
      }

      function closeImageViewer() {
        imageViewer.classList.remove('open');
        imageViewer.setAttribute('aria-hidden', 'true');
        imageViewerImage.removeAttribute('src');
        if (imageReturnFocus) imageReturnFocus.focus();
        imageReturnFocus = null;
      }

      function openRole(role) {
        const template = document.getElementById(`content-${role}`);
        if (!template) return;
        activeRole = role;
        returnFocus = document.activeElement;
        detail.dataset.kind = role;
        kicker.textContent = labels[role][0];
        title.textContent = labels[role][1];
        scroll.replaceChildren(template.content.cloneNode(true));
        scroll.scrollTop = 0;
        layer.classList.add('open');
        layer.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
        closeButton.focus();
      }

      function closeRole() {
        layer.classList.remove('open');
        layer.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
        activeRole = null;
        if (returnFocus && typeof returnFocus.focus === 'function') returnFocus.focus();
      }

      document.querySelectorAll('.role-card').forEach(card => {
        card.addEventListener('click', () => openRole(card.dataset.role));
      });

      closeButton.addEventListener('click', closeRole);
      layer.addEventListener('click', event => {
        if (event.target === layer) closeRole();
      });

      scroll.addEventListener('click', event => {
        const imageLink = event.target.closest('[data-image-viewer]');
        if (imageLink) {
          event.preventDefault();
          openImageViewer(imageLink);
          return;
        }
        const button = event.target.closest('[data-nav]');
        if (button) openRole(button.dataset.nav);
      });

      imageViewerClose.addEventListener('click', closeImageViewer);
      imageViewer.addEventListener('click', event => {
        if (event.target === imageViewer) closeImageViewer();
      });

      document.addEventListener('keydown', event => {
        if (imageViewer.classList.contains('open')) {
          if (event.key === 'Escape') closeImageViewer();
          return;
        }
        if (!activeRole) return;
        if (event.key === 'Escape') closeRole();
        if (event.key === 'Tab') {
          const focusables = detail.querySelectorAll('button, a[href]');
          if (!focusables.length) return;
          const first = focusables[0];
          const last = focusables[focusables.length - 1];
          if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
          else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
        }
      });

      // 휠은 상세 본문 스크롤에만 사용하며 카드·페이지 전환에는 사용하지 않습니다.
      void order;
    })();
  </script>
