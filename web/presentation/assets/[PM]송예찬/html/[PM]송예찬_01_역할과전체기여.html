<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>송예찬 — 역할과 전체 기여</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #03050c;
      --panel: rgba(10, 15, 31, 0.94);
      --panel-2: #0d1428;
      --text: #f5f7ff;
      --muted: #aab4ca;
      --cyan: #6ce7f2;
      --violet: #ad77ff;
      --gold: #f0bb73;
      --line: rgba(122, 226, 239, 0.24);
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Pretendard, "Noto Sans KR", "Malgun Gothic", sans-serif;
    }

    button, a { font: inherit; }
    button { color: inherit; }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 16% 18%, rgba(94, 60, 173, 0.18), transparent 31%),
        radial-gradient(circle at 82% 72%, rgba(27, 147, 168, 0.14), transparent 32%),
        linear-gradient(rgba(106, 231, 242, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(106, 231, 242, 0.025) 1px, transparent 1px);
      background-size: auto, auto, 48px 48px, 48px 48px;
    }

    .page {
      position: relative;
      min-height: 100%;
      padding: clamp(28px, 4.6vh, 58px) clamp(28px, 6vw, 112px) 32px;
      isolation: isolate;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--cyan);
      font-size: clamp(0.65rem, 0.8vw, 0.82rem);
      font-weight: 800;
      letter-spacing: 0.23em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 1100px;
      margin: 0;
      font-size: clamp(2.05rem, 4.2vw, 4.7rem);
      line-height: 1.06;
      letter-spacing: -0.045em;
    }

    .lead {
      max-width: 840px;
      margin: 15px 0 0;
      color: #c2cada;
      font-size: clamp(0.88rem, 1.15vw, 1.08rem);
      line-height: 1.68;
    }

    .role-board {
      position: relative;
      width: min(1360px, 100%);
      height: min(58vh, 570px);
      min-height: 390px;
      margin: clamp(22px, 4vh, 44px) auto 0;
    }

    .role-board::before {
      content: "";
      position: absolute;
      left: 8%;
      right: 8%;
      top: 50%;
      height: 1px;
      transform: rotate(14deg);
      transform-origin: center;
      background: linear-gradient(90deg, transparent, rgba(108, 231, 242, 0.38), rgba(173, 119, 255, 0.32), transparent);
      box-shadow: 0 0 18px rgba(108, 231, 242, 0.18);
    }

    .role-card {
      --accent: var(--cyan);
      position: absolute;
      width: min(37vw, 470px);
      min-width: 320px;
      height: clamp(180px, 23vh, 236px);
      padding: clamp(22px, 2.2vw, 34px);
      overflow: hidden;
      text-align: left;
      border: 1px solid color-mix(in srgb, var(--accent) 36%, transparent);
      border-radius: 22px;
      background:
        linear-gradient(135deg, color-mix(in srgb, var(--accent) 10%, transparent), transparent 48%),
        rgba(8, 13, 28, 0.9);
      box-shadow: 0 22px 50px rgba(0, 0, 0, 0.4), inset 0 1px rgba(255,255,255,0.035);
      cursor: pointer;
      transition: transform 220ms ease, border-color 220ms ease, box-shadow 220ms ease, filter 220ms ease;
    }

    .role-card::after {
      content: "";
      position: absolute;
      inset: auto -25% -55% 35%;
      height: 170px;
      border-radius: 50%;
      background: var(--accent);
      filter: blur(75px);
      opacity: 0.13;
      pointer-events: none;
    }

    .role-card:hover,
    .role-card:focus-visible {
      transform: translateY(-8px) scale(1.025);
      border-color: color-mix(in srgb, var(--accent) 78%, transparent);
      box-shadow: 0 28px 64px rgba(0,0,0,0.5), 0 0 35px color-mix(in srgb, var(--accent) 23%, transparent);
      outline: none;
      filter: brightness(1.08);
    }

    .role-card.pm { --accent: var(--cyan); left: 1%; top: 0; }
    .role-card.planning { --accent: var(--violet); left: 31.5%; top: 30%; }
    .role-card.development { --accent: var(--gold); right: 1%; bottom: 0; }

    .card-index {
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 0.18em;
    }

    .role-card h2 {
      margin: 12px 0 10px;
      font-size: clamp(1.35rem, 2.1vw, 2.05rem);
      letter-spacing: -0.035em;
    }

    .role-card p {
      max-width: 390px;
      margin: 0;
      color: #b6bfd2;
      font-size: clamp(0.78rem, 0.92vw, 0.93rem);
      line-height: 1.58;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 16px;
    }

    .chip {
      padding: 6px 10px;
      border: 1px solid color-mix(in srgb, var(--accent) 28%, transparent);
      border-radius: 999px;
      background: rgba(255,255,255,0.028);
      color: #dce2ef;
      font-size: clamp(0.64rem, 0.72vw, 0.74rem);
      white-space: nowrap;
    }

    .open-label {
      position: absolute;
      right: 24px;
      bottom: 20px;
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 800;
      opacity: 0;
      transform: translateX(-8px);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .role-card:hover .open-label,
    .role-card:focus-visible .open-label { opacity: 1; transform: translateX(0); }

    .page-foot {
      position: fixed;
      left: clamp(28px, 6vw, 112px);
      right: clamp(28px, 6vw, 112px);
      bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #7e8aa5;
      font-size: 0.72rem;
      pointer-events: none;
    }

    .page-count { color: var(--cyan); font-weight: 800; letter-spacing: 0.15em; }

    .modal-layer {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      padding: clamp(12px, 2.5vw, 38px);
      background: rgba(0, 2, 9, 0.78);
      backdrop-filter: blur(10px) saturate(0.72);
      opacity: 0;
      pointer-events: none;
      transition: opacity 190ms ease;
    }

    .modal-layer.open { opacity: 1; pointer-events: auto; }

    .detail {
      --accent: var(--cyan);
      position: relative;
      width: min(1180px, 96vw);
      height: min(820px, 92vh);
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--accent) 38%, transparent);
      border-radius: 24px;
      background: rgba(7, 11, 24, 0.985);
      box-shadow: 0 40px 110px rgba(0,0,0,0.72), 0 0 55px color-mix(in srgb, var(--accent) 13%, transparent);
      transform: translateY(24px) scale(0.965);
      transition: transform 220ms cubic-bezier(.2,.75,.2,1);
    }

    .modal-layer.open .detail { transform: translateY(0) scale(1); }
    .detail[data-kind="planning"] { --accent: var(--violet); }
    .detail[data-kind="development"] { --accent: var(--gold); }

    .detail-head {
      position: absolute;
      inset: 0 0 auto;
      z-index: 3;
      min-height: 116px;
      padding: 23px 82px 20px 34px;
      border-bottom: 1px solid color-mix(in srgb, var(--accent) 24%, transparent);
      background: rgba(8, 13, 28, 0.96);
      backdrop-filter: blur(12px);
    }

    .detail-kicker {
      margin: 0 0 6px;
      color: var(--accent);
      font-size: 0.7rem;
      font-weight: 900;
      letter-spacing: 0.16em;
    }

    .detail-title {
      margin: 0;
      font-size: clamp(1.65rem, 2.7vw, 2.65rem);
      letter-spacing: -0.04em;
    }

    .close {
      position: absolute;
      top: 26px;
      right: 27px;
      z-index: 5;
      width: 46px;
      height: 46px;
      padding: 0;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 50%;
      background: rgba(255,255,255,0.035);
      color: #f5f7ff;
      font-size: 1.35rem;
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    .close:hover, .close:focus-visible {
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 13%, transparent);
      transform: rotate(5deg) scale(1.06);
      outline: none;
    }

    .detail-scroll {
      height: 100%;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 145px clamp(24px, 4vw, 58px) 40px;
      scrollbar-color: color-mix(in srgb, var(--accent) 58%, transparent) rgba(255,255,255,0.04);
      scrollbar-width: thin;
    }

    .detail-intro {
      max-width: 880px;
      margin: 0 0 28px;
      color: #c3cbdb;
      font-size: clamp(0.9rem, 1.1vw, 1.04rem);
      line-height: 1.75;
    }

    .section-label {
      margin: 30px 0 14px;
      color: var(--accent);
      font-size: 0.76rem;
      font-weight: 900;
      letter-spacing: 0.14em;
    }

    .work-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 13px;
    }

    .work-item {
      padding: 19px 20px;
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 15px;
      background: rgba(255,255,255,0.027);
    }

    .work-item h3 {
      margin: 0 0 8px;
      color: #f4f6ff;
      font-size: 1rem;
    }

    .work-item p {
      margin: 0;
      color: #aeb8cd;
      font-size: 0.84rem;
      line-height: 1.65;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      margin-bottom: 10px;
      padding: 5px 9px;
      border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
      border-radius: 999px;
      color: var(--accent);
      font-size: 0.65rem;
      font-weight: 850;
      letter-spacing: 0.05em;
    }

    .notice {
      margin-top: 17px;
      padding: 16px 18px;
      border-left: 3px solid var(--accent);
      border-radius: 0 12px 12px 0;
      background: color-mix(in srgb, var(--accent) 7%, transparent);
      color: #c5cede;
      font-size: 0.82rem;
      line-height: 1.65;
    }

    .evidence-hero { margin: 0 0 16px; }
    .evidence-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-bottom: 28px; }
    .evidence-link { display: block; position: relative; overflow: hidden; border: 1px solid color-mix(in srgb, var(--accent) 28%, transparent); border-radius: 16px; background: #050711; color: #e7edf7; text-decoration: none; }
    .evidence-link img { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: contain; transition: transform 220ms ease, filter 220ms ease; }
    .evidence-link:hover img, .evidence-link:focus-visible img { transform: scale(1.015); filter: brightness(1.08); }
    .evidence-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .evidence-caption { display: flex; justify-content: space-between; gap: 12px; padding: 12px 15px; border-top: 1px solid rgba(255,255,255,0.08); background: rgba(8,13,28,0.94); font-size: 0.76rem; font-weight: 750; }
    .evidence-caption span:last-child { color: var(--accent); white-space: nowrap; }
    .image-viewer {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: clamp(14px, 3vw, 42px);
      background: rgba(0, 2, 9, 0.94);
      backdrop-filter: blur(14px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
    }

    .image-viewer.open { opacity: 1; pointer-events: auto; }

    .image-viewer-frame {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: min(1600px, 96vw);
      height: min(900px, 92vh);
      overflow: hidden;
      border: 1px solid rgba(86, 231, 255, 0.38);
      border-radius: 20px;
      background: #050711;
      box-shadow: 0 36px 100px rgba(0,0,0,0.78), 0 0 45px rgba(86,231,255,0.1);
      transform: scale(0.96);
      transition: transform 200ms cubic-bezier(.2,.75,.2,1);
    }

    .image-viewer.open .image-viewer-frame { transform: scale(1); }

    .image-viewer-image {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    .image-viewer-close {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 2;
      width: 46px;
      height: 46px;
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 50%;
      background: rgba(5,7,17,0.82);
      color: #fff;
      font-size: 1.35rem;
      cursor: pointer;
    }

    .image-viewer-close:hover, .image-viewer-close:focus-visible {
      border-color: var(--cyan);
      color: var(--cyan);
      outline: none;
      transform: scale(1.06);
    }
    .impact {
      margin-top: 26px;
      padding: 23px 24px;
      border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
      border-radius: 17px;
      background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 9%, transparent), transparent 65%);
    }

    .impact strong { display: block; margin-bottom: 8px; color: var(--accent); font-size: 0.75rem; letter-spacing: 0.12em; }
    .impact p { margin: 0; color: #e0e5f0; line-height: 1.7; }

    .detail-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 28px;
      padding-top: 22px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    .nav-button, .deep-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 16px;
      border: 1px solid rgba(255,255,255,0.13);
      border-radius: 999px;
      background: rgba(255,255,255,0.035);
      color: #dce2ee;
      text-decoration: none;
      cursor: pointer;
    }

    .nav-button:hover, .nav-button:focus-visible, .deep-link:hover, .deep-link:focus-visible {
      border-color: var(--accent);
      color: var(--accent);
      outline: none;
    }

    .deep-link {
      border-color: color-mix(in srgb, var(--accent) 42%, transparent);
      background: color-mix(in srgb, var(--accent) 9%, transparent);
      color: var(--accent);
      font-weight: 800;
    }

    @media (max-width: 930px), (max-height: 720px) {
      html, body { overflow: auto; }
      .page { min-height: 100vh; padding-bottom: 70px; }
      .role-board { height: auto; min-height: 0; display: grid; gap: 14px; }
      .role-board::before { display: none; }
      .role-card.pm, .role-card.planning, .role-card.development {
        position: relative;
        inset: auto;
        width: 100%;
        min-width: 0;
        height: auto;
        min-height: 174px;
      }
      .page-foot { position: relative; left: auto; right: auto; bottom: auto; margin-top: 24px; }
    }

    @media (max-width: 720px) {
      .work-grid { grid-template-columns: 1fr; }
      .evidence-pair { grid-template-columns: 1fr; }
      .detail-head { min-height: 104px; padding: 20px 68px 17px 22px; }
      .detail-scroll { padding: 128px 20px 28px; }
      .close { top: 20px; right: 18px; width: 42px; height: 42px; }
      .detail-actions { align-items: stretch; flex-direction: column; }
      .nav-button, .deep-link { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main class="page" aria-labelledby="page-title">
    <p class="eyebrow">SONG YECHAN · ROLE & CONTRIBUTION MAP</p>
    <h1 id="page-title">PM 업무와 기획·개발을<br>병행해서 수행했습니다.</h1>
    <p class="lead">세 역할은 상하 관계가 아닌 병행한 업무 축입니다. 각 카드를 선택하면 맡은 범위와 팀에 기여한 결과를 확인할 수 있습니다.</p>

    <section class="role-board" aria-label="송예찬의 역할별 업무">
      <button class="role-card pm" type="button" data-role="pm" aria-haspopup="dialog">
        <span class="card-index">01 · PROJECT MANAGEMENT</span>
        <h2>PM 업무</h2>
        <p>일정·회의·개발 기록·문서와 빌드를 한곳에서 관리하는 Notion 팀 운영 허브를 직접 설계하고 운영했습니다.</p>
        <span class="chips" aria-hidden="true"><span class="chip">Notion 운영 허브</span><span class="chip">업무지도</span><span class="chip">스크럼·개발일지</span></span>
        <span class="open-label">세부 내용 보기 →</span>
      </button>

      <button class="role-card planning" type="button" data-role="planning" aria-haspopup="dialog">
        <span class="card-index">02 · PLANNING</span>
        <h2>기획 업무</h2>
        <p>초기 컨셉 문서를 제안하고, 꿈식자는 세계관과 행동 구조를 직접 설계했습니다.</p>
        <span class="chips" aria-hidden="true"><span class="chip">컨셉 초안</span><span class="chip">후속 초안</span><span class="chip">꿈식자 직접 기획</span></span>
        <span class="open-label">세부 내용 보기 →</span>
      </button>

      <button class="role-card development" type="button" data-role="development" aria-haspopup="dialog">
        <span class="card-index">03 · DEVELOPMENT</span>
        <h2>개발 업무</h2>
        <p>AI부터 튜토리얼, 입력·UI 피드백까지 실제 플레이에 필요한 기능을 구현하고 안정화했습니다.</p>
        <span class="chips" aria-hidden="true"><span class="chip">Enemy AI</span><span class="chip">Tutorial</span><span class="chip">UI·VFX</span></span>
        <span class="open-label">세부 내용 보기 →</span>
      </button>
    </section>

    <footer class="page-foot"><span>카드를 클릭해 상세 업무를 확인하세요</span><span class="page-count">01 / 03 · OVERVIEW</span></footer>
  </main>

  <div class="modal-layer" id="modal-layer" aria-hidden="true">
    <article class="detail" id="detail" role="dialog" aria-modal="true" aria-labelledby="detail-title" data-kind="pm">
      <header class="detail-head">
        <p class="detail-kicker" id="detail-kicker"></p>
        <h2 class="detail-title" id="detail-title"></h2>
      </header>
      <button class="close" id="close" type="button" aria-label="상세 내용 닫기">×</button>
      <div class="detail-scroll" id="detail-scroll"></div>
    </article>
  </div>

  <template id="content-pm">
    <p class="detail-intro">PM 역할의 핵심 결과물은 팀 REMnants의 Notion 운영 허브입니다. 전체 일정이 주별 목표와 하루 업무로 구체화되고, 팀원들의 실행 기록이 다시 주간 판단과 다음 일정으로 반영되는 하나의 업무지도를 목표로 정보 구조를 직접 설계하고 운영했습니다.</p>

    <div class="evidence-hero">
      <a class="evidence-link" href="../images/PM_Notion_WorkMap.png" target="_blank" rel="noopener noreferrer">
        <img src="../images/PM_Notion_WorkMap.png" alt="전체 일정표부터 일일 개발일지와 주간 개발일지, 다음 일정 조정으로 이어지는 팀 업무지도">
        <span class="evidence-caption"><span>Notion으로 구축한 순환형 팀 업무지도</span><span>이미지 확대 ↗</span></span>
      </a>
    </div>
    <div class="evidence-pair">
      <a class="evidence-link" href="../images/PM_Project_Timeline.png" target="_blank" rel="noopener noreferrer">
        <img src="../images/PM_Project_Timeline.png" alt="기획부터 최종 발표까지의 팀 전체 일정">
        <span class="evidence-caption"><span>전체 일정 타임라인</span><span>확대 ↗</span></span>
      </a>
      <a class="evidence-link" href="../images/PM_Weekly_Milestones.png" target="_blank" rel="noopener noreferrer">
        <img src="../images/PM_Weekly_Milestones.png" alt="주차별 목표와 완료 조건을 정리한 마일스톤">
        <span class="evidence-caption"><span>주별 마일스톤·판정 기준</span><span>확대 ↗</span></span>
      </a>
    </div>

    <p class="section-label">직접 설계·구축한 운영 구조</p>
    <div class="work-grid">

  <script>
    (() => {
      const layer = document.getElementById('modal-layer');
      const detail = document.getElementById('detail');
      const scroll = document.getElementById('detail-scroll');
      const title = document.getElementById('detail-title');
      const kicker = document.getElementById('detail-kicker');
      const closeButton = document.getElementById('close');
      const order = ['pm', 'planning', 'development'];
      const labels = {
        pm: ['01 · PROJECT MANAGEMENT', 'PM 업무'],
        planning: ['02 · PLANNING', '기획 업무'],
        development: ['03 · DEVELOPMENT', '개발 업무']
      };
      let activeRole = null;
      let returnFocus = null;

      function openRole(role) {
        const template = document.getElementById(`content-${role}`);
        if (!template) return;
        activeRole = role;
        returnFocus = document.activeElement;
        detail.dataset.kind = role;
        kicker.textContent = labels[role][0];
        title.textContent = labels[role][1];
        scroll.replaceChildren(template.content.cloneNode(true));
        scroll.scrollTop = 0;
        layer.classList.add('open');
        layer.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
        closeButton.focus();
      }

      function closeRole() {
        layer.classList.remove('open');
        layer.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
        activeRole = null;
        if (returnFocus && typeof returnFocus.focus === 'function') returnFocus.focus();
      }

      document.querySelectorAll('.role-card').forEach(card => {
        card.addEventListener('click', () => openRole(card.dataset.role));
      });

      closeButton.addEventListener('click', closeRole);
      layer.addEventListener('click', event => {
        if (event.target === layer) closeRole();
      });

      scroll.addEventListener('click', event => {
        const button = event.target.closest('[data-nav]');
        if (button) openRole(button.dataset.nav);
      });

      document.addEventListener('keydown', event => {
        if (!activeRole) return;
        if (event.key === 'Escape') closeRole();
        if (event.key === 'Tab') {
          const focusables = detail.querySelectorAll('button, a[href]');
          if (!focusables.length) return;
          const first = focusables[0];
          const last = focusables[focusables.length - 1];
          if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
          else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
        }
      });

      // 휠은 상세 본문 스크롤에만 사용하며 카드·페이지 전환에는 사용하지 않습니다.
      void order;
    })();
  </script>
