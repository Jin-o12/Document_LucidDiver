<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>꿈식자 AI 행동 인터랙티브 — 송예찬 기획·개발</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #02040a;
      --panel: rgba(7, 12, 26, 0.97);
      --panel-soft: #10182f;
      --cyan: #7cecf5;
      --cyan-strong: #23c9dc;
      --violet: #aa72ff;
      --red: #ff776d;
      --text: #f5f7ff;
      --muted: #a9b3ca;
      --border: rgba(132, 236, 244, 0.28);
    }

    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Pretendard, "Noto Sans KR", "Malgun Gothic", sans-serif;
    }

    button {
      font: inherit;
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: grid;
      place-items: center;
      isolation: isolate;
      background:
        radial-gradient(circle at 50% 45%, rgba(28, 105, 132, 0.17), transparent 46%),
        #02040a;
    }

    .diagram {
      position: relative;
      width: min(100vw, calc(100vh * 1.7768));
      height: min(100vh, calc(100vw / 1.7768));
      overflow: hidden;
      background: #000;
    }

    .diagram-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    .usage-hint {
      position: absolute;
      top: 18px;
      left: 20px;
      z-index: 4;
      padding: 9px 13px;
      border: 1px solid rgba(132, 236, 244, 0.34);
      border-radius: 999px;
      background: rgba(2, 6, 15, 0.83);
      color: var(--cyan);
      font-size: clamp(0.64rem, 0.78vw, 0.8rem);
      pointer-events: none;
    }

    .hotspot.spawn-node {
      display: grid;
      place-items: center;
      border-color: rgba(124, 236, 245, 0.88);
      background: radial-gradient(circle, rgba(21, 118, 137, 0.58), rgba(3, 23, 34, 0.9) 68%);
      box-shadow: 0 0 24px rgba(35, 201, 220, 0.48), inset 0 0 18px rgba(124, 236, 245, 0.16);
      color: #e4fbff;
      font-family: "Noto Serif KR", "Nanum Myeongjo", "Batang", serif;
      font-size: clamp(0.62rem, 0.86vw, 0.92rem);
      font-weight: 700;
      letter-spacing: -0.06em;
      line-height: 1.18;
      text-align: center;
      text-shadow: 0 0 10px rgba(124, 236, 245, 0.85);
    }

    .hotspot.spawn-node span { pointer-events: none; }

    .hotspot.spawn-node::before {
      content: "→";
      position: absolute;
      left: 98%;
      top: 50%;
      width: clamp(60px, 7vw, 112px);
      transform: translateY(-52%);
      color: var(--cyan);
      font-size: clamp(1.25rem, 2.4vw, 2.5rem);
      font-weight: 300;
      text-align: center;
      filter: drop-shadow(0 0 7px rgba(35, 201, 220, 0.8));
      pointer-events: none;
    }
    .hotspot {
      --size: clamp(50px, 7vw, 116px);
      position: absolute;
      left: var(--x);
      top: var(--y);
      z-index: 5;
      width: var(--size);
      height: var(--size);
      padding: 0;
      transform: translate(-50%, -50%);
      border: 2px solid transparent;
      border-radius: 50%;
      background: rgba(35, 201, 220, 0.015);
      cursor: pointer;
      transition: transform 170ms ease, border-color 170ms ease, background 170ms ease, box-shadow 170ms ease;
    }

    .hotspot::after {
      content: "";
      position: absolute;
      inset: -5px;
      border: 1px solid transparent;
      border-radius: inherit;
      pointer-events: none;
    }

    .hotspot:hover,
    .hotspot:focus-visible,
    .hotspot.selected {
      transform: translate(-50%, -50%) scale(1.12);
      border-color: var(--cyan);
      background: rgba(35, 201, 220, 0.14);
      box-shadow: 0 0 0 7px rgba(35, 201, 220, 0.09), 0 0 34px rgba(35, 201, 220, 0.8), inset 0 0 22px rgba(35, 201, 220, 0.18);
      outline: none;
    }

    .hotspot:hover::after,
    .hotspot:focus-visible::after,
    .hotspot.selected::after {
      border-color: rgba(132, 236, 244, 0.72);
      animation: halo 1.35s ease-out infinite;
    }

    .hotspot[data-key="attack"]:hover,
    .hotspot[data-key="attack"]:focus-visible,
    .hotspot[data-key="attack"].selected {
      border-color: var(--red);
      background: rgba(255, 119, 109, 0.15);
      box-shadow: 0 0 0 7px rgba(255, 119, 109, 0.09), 0 0 34px rgba(255, 119, 109, 0.78), inset 0 0 22px rgba(255, 119, 109, 0.16);
    }

    .hotspot[data-key="attack"]:hover::after,
    .hotspot[data-key="attack"]:focus-visible::after,
    .hotspot[data-key="attack"].selected::after {
      border-color: rgba(255, 119, 109, 0.74);
    }

    @keyframes halo {
      from {
        inset: -4px;
        opacity: 0.9;
      }

      to {
        inset: -20px;
        opacity: 0;
      }
    }

    .hover-card {
      position: fixed;
      z-index: 30;
      width: min(300px, calc(100vw - 32px));
      padding: 15px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(5, 11, 24, 0.95);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.5), 0 0 24px rgba(35, 201, 220, 0.13);
      backdrop-filter: blur(12px);
      pointer-events: none;
      opacity: 0;
      transform: translateY(7px) scale(0.98);
      transition: opacity 130ms ease, transform 130ms ease;
    }

    .hover-card.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .hover-index {
      margin: 0 0 6px;
      color: var(--cyan);
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.13em;
    }

    .hover-title {
      margin: 0 0 7px;
      font-size: 1.06rem;
    }

    .hover-summary {
      margin: 0;
      color: #c5cde0;
      font-size: 0.8rem;
      line-height: 1.55;
    }

    .hover-action {
      display: block;
      margin-top: 10px;
      color: var(--violet);
      font-size: 0.72rem;
      font-weight: 700;
    }

    .modal-layer {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      padding: clamp(14px, 3vw, 42px);
      background: rgba(0, 2, 8, 0.72);
      backdrop-filter: blur(7px) saturate(0.72);
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
    }

    .modal-layer.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      position: relative;
      width: min(1100px, 96vw);
      max-height: min(900px, 92vh);
      overflow: auto;
      border: 1px solid rgba(132, 236, 244, 0.28);
      border-radius: 18px;
      background:
        linear-gradient(145deg, rgba(14, 22, 44, 0.98), rgba(5, 10, 22, 0.99));
      box-shadow: 0 30px 100px rgba(0, 0, 0, 0.74), 0 0 44px rgba(35, 201, 220, 0.13);
      transform: translateY(18px) scale(0.97);
      transition: transform 200ms cubic-bezier(.2, .8, .2, 1);
    }

    .modal-layer.open .modal {
      transform: translateY(0) scale(1);
    }

    .close-button {
      position: sticky;
      float: right;
      top: 16px;
      right: 16px;
      z-index: 3;
      width: 40px;
      height: 40px;
      margin: 16px 16px -56px 0;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 50%;
      background: rgba(3, 7, 16, 0.82);
      color: var(--text);
      font-size: 1.35rem;
      cursor: pointer;
    }

    .close-button:hover,
    .close-button:focus-visible {
      border-color: var(--cyan);
      color: var(--cyan);
      outline: none;
    }

    .modal-content {
      padding: clamp(24px, 4vw, 50px);
    }

    .modal-index {
      margin: 0 0 10px;
      color: var(--cyan);
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 0.15em;
    }

    .modal-title {
      margin: 0;
      font-size: clamp(1.75rem, 3.4vw, 3.2rem);
      line-height: 1.1;
      letter-spacing: -0.045em;
    }

    .modal-summary {
      max-width: 900px;
      margin: 15px 0 24px;
      color: #d1d8e8;
      font-size: clamp(0.92rem, 1.2vw, 1.06rem);
      line-height: 1.75;
    }

    .modal-grid {
      display: grid;
      grid-template-columns: minmax(300px, 0.95fr) minmax(340px, 1.05fr);
      gap: 24px;
      align-items: start;
    }

    .media-frame {
      position: sticky;
      top: 18px;
      min-height: 320px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 14px;
      background:
        linear-gradient(rgba(4, 8, 18, 0.62), rgba(4, 8, 18, 0.88)),
        url("../images/PM_EnemyAI_ConceptToRuntime.png") center / cover;
    }

    .media-frame img {
      display: block;
      width: 100%;
      min-height: 320px;
      max-height: 480px;
      object-fit: cover;
    }

    .media-fallback {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 26px;
      text-align: center;
    }

    .media-pulse {
      width: 84px;
      height: 84px;
      margin: 0 auto 18px;
      border: 2px solid var(--cyan);
      border-radius: 50%;
      box-shadow: 0 0 28px rgba(35, 201, 220, 0.44);
      animation: mediaPulse 1.7s ease-in-out infinite;
    }

    @keyframes mediaPulse {

      0%,
      100% {
        transform: scale(0.78);
        opacity: 0.42;
      }

      50% {
        transform: scale(1.07);
        opacity: 1;
      }
    }

    .media-fallback strong {
      display: block;
      color: var(--cyan);
    }

    .media-fallback span {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.75rem;
      word-break: break-all;
    }

    .section-title {
      margin: 0 0 12px;
      color: var(--violet);
      font-size: 0.9rem;
      letter-spacing: 0.04em;
    }

    .logic-list {
      display: grid;
      gap: 9px;
      margin: 0;
      padding: 0;
      list-style: none;
      counter-reset: logic;
    }

    .logic-list li {
      position: relative;
      padding: 12px 13px 12px 44px;
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 10px;
      background: var(--panel-soft);
      color: #dce2f1;
      font-size: 0.88rem;
      line-height: 1.55;
    }

    .logic-list li::before {
      counter-increment: logic;
      content: counter(logic);
      position: absolute;
      left: 13px;
      top: 12px;
      display: grid;
      width: 21px;
      height: 21px;
      place-items: center;
      border-radius: 50%;
      background: rgba(35, 201, 220, 0.18);
      color: var(--cyan);
      font-size: 0.7rem;
      font-weight: 900;
    }

    .implementation-block {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .implementation {
      margin: 0;
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.72;
    }

    code {
      color: var(--cyan);
      font-family: Consolas, "D2Coding", monospace;
    }

    .state-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 26px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .state-nav button {
      padding: 8px 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }

    .state-nav button:hover,
    .state-nav button.active {
      border-color: var(--cyan);
      background: rgba(35, 201, 220, 0.14);
      color: var(--text);
    }

    .asset-note {
      margin: 14px 0 0;
      color: #7f8aa6;
      font-size: 0.72rem;
      line-height: 1.55;
    }

    @media (max-width: 820px) {
      .modal-layer {
        padding: 0;
      }

      .modal {
        width: 100vw;
        max-height: 100vh;
        min-height: 100vh;
        border: 0;
        border-radius: 0;
      }

      .modal-grid {
        grid-template-columns: 1fr;
      }

      .media-frame {
        position: relative;
        min-height: 220px;
      }

      .media-frame img {
        min-height: 220px;
      }

      .hotspot {
        --size: clamp(38px, 8vw, 68px);
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="stage">
    <div class="diagram" id="diagram">
      <img class="diagram-image" src="../images/PM_EnemyAI_ConceptToRuntime.png"
        alt="꿈식자의 세계관, AI 행동 루프, 플레이 경험을 보여주는 다이어그램">
      <p class="usage-hint">마우스: 간략 소개 · 클릭: 상세 로직과 GIF</p>

      <button class="hotspot spawn-node" style="--x:33.7%;--y:22.5%" data-key="spawn"
        aria-label="랜덤 스폰과 순찰 시작 상세 보기"><span>스폰<br>시작</span></button>
      <button class="hotspot" style="--x:46.8%;--y:22.5%" data-key="patrol" aria-label="순찰 상세 보기"></button>
      <button class="hotspot" style="--x:62.2%;--y:31.8%" data-key="detect" aria-label="시야와 소리 감지 상세 보기"></button>
      <button class="hotspot" style="--x:66.7%;--y:52.0%" data-key="investigate" aria-label="조사 상세 보기"></button>
      <button class="hotspot" style="--x:63.4%;--y:73.3%" data-key="chase" aria-label="추격 상세 보기"></button>
      <button class="hotspot" style="--x:47.9%;--y:84.7%" data-key="attack" aria-label="공격과 길목 압박 상세 보기"></button>
      <button class="hotspot" style="--x:33.0%;--y:73.1%" data-key="search" aria-label="탐색 상세 보기"></button>
      <button class="hotspot" style="--x:29.8%;--y:43.3%" data-key="return" aria-label="개별 순찰 복귀 상세 보기"></button>
    </div>
  </main>

  <aside class="hover-card" id="hoverCard" role="status" aria-live="polite">
    <p class="hover-index" id="hoverIndex"></p>
    <h2 class="hover-title" id="hoverTitle"></h2>
    <p class="hover-summary" id="hoverSummary"></p>
    <span class="hover-action">클릭해서 상세 로직과 GIF 보기</span>
  </aside>

  <div class="modal-layer" id="modalLayer" aria-hidden="true">
    <article class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="close-button" id="closeButton" type="button" aria-label="상세 창 닫기">×</button>
      <div class="modal-content">
        <p class="modal-index" id="modalIndex"></p>
        <h2 class="modal-title" id="modalTitle"></h2>
        <p class="modal-summary" id="modalSummary"></p>

        <div class="modal-grid">
          <div class="media-frame">
            <img id="detailGif" alt="" hidden>
            <div class="media-fallback" id="mediaFallback">
              <div>
                <div class="media-pulse"></div>
                <strong>GIF 연결 대기</strong>
                <span id="gifPath"></span>
              </div>
            </div>
          </div>

          <div>
            <h3 class="section-title">행동 로직</h3>
            <ol class="logic-list" id="logicList"></ol>
            <div class="implementation-block">
              <h3 class="section-title">구현 근거</h3>
              <p class="implementation" id="implementation"></p>
            </div>
          </div>
        </div>

        <nav class="state-nav" id="stateNav" aria-label="다른 AI 상태 보기"></nav>
        <p class="asset-note">안내된 경로에 GIF를 넣으면 새로고침 후 자동 표시됩니다. 바깥 영역이나 × 버튼을 클릭하거나 Esc를 누르면 창이 닫힙니다.</p>
      </div>
    </article>
  </div>

  <script>
    const states = {
      spawn: {
        index: "01 / 08 · SPAWN", label: "스폰", title: "랜덤 스폰과 순찰 준비",
        hover: "활동 구역 안의 후보 지점에 스폰하고, 해당 지점의 패트롤 루트와 시작 위치를 배정합니다.",
        summary: "에너미는 정해진 한 지점에서 반복 등장하지 않습니다. 스폰 존의 후보 중 하나를 선택한 뒤 그 지점에 연결된 패트롤 루트와 가장 가까운 시작 포인트를 기억하고 순찰을 시작합니다.",
        logic: ["스폰 존 안의 후보 지점 중 하나를 무작위로 선택합니다.", "선택한 스폰 지점에 에너미 개체를 생성합니다.", "스폰 지점에 연결된 패트롤 루트를 개체의 활동 구역으로 저장합니다.", "루트에서 가장 가까운 시작 포인트를 선택해 랜덤 순찰 상태로 전환합니다."],
        implementation: "<code>SpawnManager</code>가 스폰 포인트를 선택하고 연결된 패트롤 루트와 시작 인덱스를 개체에 전달합니다. 이후 <code>EnemyMemory</code>가 개체별 루트 정보를 유지합니다.",
        gif: "../gifs/PM_EnemyAI_SpawnPatrol.gif"
      }, patrol: {
        index: "02 / 08 · PATROL", label: "순찰", title: "통제된 랜덤 순찰",
        hover: "패트롤 루트로 구역을 지키면서 NavMesh 목적지와 다음 포인트를 무작위화합니다.",
        summary: "배정된 패트롤 루트 안에서 NavMesh 목적지와 다음 포인트를 무작위화해 같은 길을 기계적으로 반복하지 않도록 설계했습니다.",
        logic: ["배정된 루트의 현재 포인트를 순찰 기준으로 사용합니다.", "포인트 반경에서 도달 가능한 NavMesh 목적지를 무작위로 생성합니다.", "배회 횟수와 대기 시간을 무작위로 선택합니다.", "다음 인접 포인트를 무작위로 고르고 순찰을 이어갑니다."],
        implementation: "<code>Random.insideUnitCircle</code>로 후보를 만들고 <code>NavMesh.SamplePosition</code>과 <code>NavMeshPathStatus.PathComplete</code>를 통과한 좌표만 사용합니다.",
        gif: "../gifs/PM_EnemyAI_Patrol.gif"
      },
      detect: {
        index: "03 / 08 · PERCEPTION", label: "감지", title: "시야·소리 감지",
        hover: "시야는 각도와 장애물을, 소리는 반경·차단·우선순위를 판정합니다.",
        summary: "시야는 각도와 장애물을 검사하고, 소리는 플레이어의 정답 위치가 아니라 발생 지점·반경·종류별 우선순위만 전달합니다.",
        logic: ["시야 범위와 각도 안에 타겟이 있는지 확인합니다.", "Raycast로 벽이나 장애물에 가려졌는지 검사합니다.", "소음 반경과 에너미의 청각 범위를 함께 비교합니다.", "기존 조사보다 우선순위가 높은 소리인지 판단합니다."],
        implementation: "<code>EnemyPerception</code>이 시야·청각을 판정하고, <code>NoiseStimulus</code>가 발생 위치·반경·우선순위·추격 중단 가능 여부를 전달합니다.",
        gif: "../gifs/PM_EnemyAI_Detect.gif"
      },

    const hotspots = [...document.querySelectorAll(".hotspot")];
    const hoverCard = document.getElementById("hoverCard");
    const hoverIndex = document.getElementById("hoverIndex");
    const hoverTitle = document.getElementById("hoverTitle");
    const hoverSummary = document.getElementById("hoverSummary");
    const modalLayer = document.getElementById("modalLayer");
    const modal = document.getElementById("modal");
    const closeButton = document.getElementById("closeButton");
    const modalIndex = document.getElementById("modalIndex");
    const modalTitle = document.getElementById("modalTitle");
    const modalSummary = document.getElementById("modalSummary");
    const logicList = document.getElementById("logicList");
    const implementation = document.getElementById("implementation");
    const detailGif = document.getElementById("detailGif");
    const mediaFallback = document.getElementById("mediaFallback");
    const gifPath = document.getElementById("gifPath");
    const stateNav = document.getElementById("stateNav");
    let selectedKey = null;
    let lastFocusedHotspot = null;

    Object.entries(states).forEach(([key, state]) => {
      const button = document.createElement("button");
      button.type = "button";
      button.dataset.key = key;
      button.textContent = state.label;
      button.addEventListener("click", () => renderModal(key));
      stateNav.appendChild(button);
    });

    function positionHoverCard(button) {
      const rect = button.getBoundingClientRect();
      const cardWidth = Math.min(300, window.innerWidth - 32);
      const cardHeight = hoverCard.offsetHeight || 150;
      let left = rect.right + 14;
      let top = rect.top + rect.height / 2 - cardHeight / 2;

      if (left + cardWidth > window.innerWidth - 16) left = rect.left - cardWidth - 14;
      top = Math.max(16, Math.min(top, window.innerHeight - cardHeight - 16));
      hoverCard.style.left = `${Math.max(16, left)}px`;
      hoverCard.style.top = `${top}px`;
    }

    function showHover(button, key) {
      if (modalLayer.classList.contains("open")) return;
      const state = states[key];
      hoverIndex.textContent = state.index;
      hoverTitle.textContent = state.title;
      hoverSummary.textContent = state.hover;
      hoverCard.classList.add("show");
      requestAnimationFrame(() => positionHoverCard(button));
    }

    function hideHover() { hoverCard.classList.remove("show"); }

    function renderModal(key) {
      const state = states[key];
      selectedKey = key;
      modalIndex.textContent = state.index;
      modalTitle.textContent = state.title;
      modalSummary.textContent = state.summary;
      implementation.innerHTML = state.implementation;
      logicList.replaceChildren(...state.logic.map(text => {
        const item = document.createElement("li");
        item.textContent = text;
        return item;
      }));

      hotspots.forEach(button => button.classList.toggle("selected", button.dataset.key === key));
      [...stateNav.children].forEach(button => button.classList.toggle("active", button.dataset.key === key));

      detailGif.hidden = true;
      mediaFallback.hidden = false;
      gifPath.textContent = state.gif;
      detailGif.alt = `${state.title} 게임 플레이 GIF`;
      detailGif.onload = () => { detailGif.hidden = false; mediaFallback.hidden = true; };
      detailGif.onerror = () => { detailGif.hidden = true; mediaFallback.hidden = false; };
      detailGif.src = `${state.gif}?state=${encodeURIComponent(key)}`;
    }

    function openModal(key, sourceButton) {
      lastFocusedHotspot = sourceButton;
      hideHover();
      renderModal(key);
      modalLayer.classList.add("open");
      modalLayer.setAttribute("aria-hidden", "false");
      document.body.classList.add("modal-open");
      closeButton.focus();
    }

    function closeModal() {
      modalLayer.classList.remove("open");
      modalLayer.setAttribute("aria-hidden", "true");
      document.body.classList.remove("modal-open");
      hotspots.forEach(button => button.classList.remove("selected"));
      selectedKey = null;
      if (lastFocusedHotspot) lastFocusedHotspot.focus();
    }

    hotspots.forEach(button => {
      const key = button.dataset.key;
      button.addEventListener("mouseenter", () => showHover(button, key));
      button.addEventListener("mouseleave", hideHover);
      button.addEventListener("focus", () => showHover(button, key));
      button.addEventListener("blur", hideHover);
      button.addEventListener("click", () => openModal(key, button));
    });

    closeButton.addEventListener("click", closeModal);
    modalLayer.addEventListener("click", event => { if (event.target === modalLayer) closeModal(); });
    modal.addEventListener("click", event => event.stopPropagation());
    window.addEventListener("resize", hideHover);
    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && modalLayer.classList.contains("open")) closeModal();
    });
  </script>
